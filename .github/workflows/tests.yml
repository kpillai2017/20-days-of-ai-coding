# Keep every completed day's checks passing as the series grows.
# These action releases use Node 24 internally; that is separate from the
# project's Node 22 test version below. Pin the OS to avoid silent migrations.
name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scrabble:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    defaults:
      run:
        working-directory: day-15-scrabble
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pygame
        run: python -m pip install -r requirements.txt
      - name: Verify rules, computer games and private-rack UI
        run: python -m unittest discover -s tests -v
      - name: Smoke-test lobby and computer table
        run: |
          python main.py --seed 42 --frames 3
          python main.py --demo --seed 42 --frames 10
  property-table:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    defaults:
      run:
        working-directory: day-14-monopoly
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pygame
        run: python -m pip install -r requirements.txt
      - name: Test rules, full computer games and UI controls
        run: python -m unittest discover -s tests -v
      - name: Smoke-test setup and computer play
        run: |
          python main.py --seed 42 --frames 3
          python main.py --demo --seed 42 --frames 5
  clockwork:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check clock JavaScript syntax
        run: |
          node --check day-13-clockwork/clock.js
          node --check day-13-clockwork/renderer.js
          node --check day-13-clockwork/gears.js
          node --check day-13-clockwork/camera.js
          node --check day-13-clockwork/renderer3d.js
          node --check day-13-clockwork/audio.js
          node --check day-13-clockwork/app.js
      - name: Test local-time clock and chime scheduling
        run: node --test day-13-clockwork/tests/*.cjs
  sort-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check sorting JavaScript syntax
        run: |
          node --check day-12-sort-lab/algorithms.js
          node --check day-12-sort-lab/app.js
      - name: Test nine sorting algorithms and event invariants
        run: node --test day-12-sort-lab/tests/algorithms.test.cjs
  clockwork-chess:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    defaults:
      run:
        working-directory: day-11-clockwork-chess
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pygame
        run: python -m pip install -r requirements.txt
      - name: Test legal chess, AI and animations
        run: python -m unittest discover -s tests -v
      - name: Smoke-test real window loop
        run: python main.py --mute --frames 30
  sudoku-studio:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    defaults:
      run:
        working-directory: day-10-sudoku-studio
    env:
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pygame
        run: python -m pip install -r requirements.txt
      - name: Test unique generation, solving and headless controls
        run: python -m unittest discover -s tests -v
      - name: Smoke-test real game loop
        run: python main.py --seed 42 --frames 30
  vector-tanks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    defaults:
      run:
        working-directory: day-09-vector-tanks
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pygame
        run: python -m pip install -r requirements.txt
      - name: Test combat, projection and headless controls
        run: python -m unittest discover -s tests -v
      - name: Smoke-test real game loop
        run: python main.py --seed 42 --demo --frames 30 --mute
  koan-garden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check day-08-koan-garden/koan.js
          node --check day-08-koan-garden/app.js
      - name: Test contextual writing and input boundaries
        run: node --test day-08-koan-garden/tests/koan.test.cjs
  pixel-life:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check day-01-pixel-life/life.js
          node --check day-01-pixel-life/app.js
      - name: Test simulation rules
        run: node --test day-01-pixel-life/tests/life.test.cjs
  pocket-tasks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check day-03-pocket-tasks/tasks.js
          node --check day-03-pocket-tasks/app.js
      - name: Test task operations and saved-data validation
        run: node --test day-03-pocket-tasks/tests/tasks.test.cjs
  typing-sprint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check day-05-typing-sprint/sprint.js
          node --check day-05-typing-sprint/app.js
      - name: Test scoring and deterministic session deadlines
        run: node --test day-05-typing-sprint/tests/sprint.test.cjs
  breakout:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    defaults:
      run:
        working-directory: day-02-breakout
    env:
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pygame
        run: python -m pip install -r requirements.txt
      - name: Test rules and headless window controls
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the real game loop
        run: python main.py --frames 5
  maze-explorer:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    defaults:
      run:
        working-directory: day-04-maze-explorer
    env:
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pygame
        run: python -m pip install -r requirements.txt
      - name: Test algorithms and headless window controls
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the real game loop
        run: python main.py --seed 42 --frames 5
  enigma-lab:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    defaults:
      run:
        working-directory: day-06-enigma-lab
    env:
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pygame (no reference cipher dependency)
        run: python -m pip install -r requirements.txt
      - name: Test reference vectors, stepping and headless controls
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the real interface loop
        run: python main.py --frames 5
  engine-explorer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check day-07-engine-explorer/engine.js
          node --check day-07-engine-explorer/renderer.js
          node --check day-07-engine-explorer/app.js
      - name: Test kinematics and cycle timing
        run: node --test day-07-engine-explorer/tests/engine.test.cjs
